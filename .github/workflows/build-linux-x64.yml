name: Build redhat for Linux x64 (static OpenSSL)

on:
  workflow_dispatch:
  push:
    branches:
      - agent/build-v0.4.8-linux-x64
    paths:
      - .github/workflows/build-linux-x64.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu
  RUST_TOOLCHAIN: 1.69.0
  CROSS_VERSION: 0.1.16
  OPENSSL_VERSION: 1.0.2t

jobs:
  build:
    name: Linux x64 (static OpenSSL)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust and cross versions
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo install cross --version "$CROSS_VERSION" --locked
          rustc --version
          cargo --version
          cross --version

      - name: Build with cross image and static OpenSSL
        run: |
          cross build --release --locked --target "$TARGET"
          mkdir -p dist/pristine
          install -m 0755 "target/$TARGET/release/redhat" dist/pristine/redhat
          "dist/pristine/redhat" --version

      - name: Generate fresh TLS certificates for integration tests
        run: |
          pushd examples/tls
          sh ./create_self_signed_cert.sh
          openssl pkcs12 -export \
            -out identity.pfx \
            -inkey server.key \
            -in server.crt \
            -certfile rootCA.crt \
            -passout pass:1234 \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1
          openssl x509 -in rootCA.crt -noout -checkend 86400
          openssl x509 -in server.crt -noout -checkend 86400
          popd

      - name: Run release tests with refreshed certificates
        timeout-minutes: 15
        run: cross test --release --locked --target "$TARGET" --verbose

      - name: Verify linkage, then package binary and checksums
        run: |
          SOURCE_VERSION="$(grep --max-count=1 '^version' Cargo.toml | cut -d '"' -f2)"
          mkdir -p dist/package
          install -m 0755 dist/pristine/redhat dist/package/redhat
          file dist/package/redhat | tee dist/package/file-info.txt
          readelf --dynamic dist/package/redhat | tee dist/package/dynamic-section.txt
          ldd dist/package/redhat | tee dist/package/linked-libraries.txt
          if grep --extended-regexp --ignore-case 'lib(ssl|crypto)\.so' dist/package/dynamic-section.txt dist/package/linked-libraries.txt; then
            echo "OpenSSL was dynamically linked; refusing to publish this artifact."
            exit 1
          fi
          {
            echo "source_repository=${{ github.server_url }}/${{ github.repository }}"
            echo "source_version=v${SOURCE_VERSION}"
            echo "source_commit=${{ github.sha }}"
            echo "target=$TARGET"
            echo "rust_toolchain=$RUST_TOOLCHAIN"
            echo "cross_version=$CROSS_VERSION"
            echo "openssl_version=$OPENSSL_VERSION"
            echo "openssl_linkage=static"
            echo "cross_base=ubuntu:14.04"
            echo "upx=disabled"
            echo "test_certificates=regenerated_after_release_build"
            rustc --version
            cargo --version
            cross --version
          } > dist/package/build-info.txt
          tar -C dist/package -czf "dist/redhat-v${SOURCE_VERSION}-$TARGET-static-openssl.tar.gz" \
            redhat build-info.txt file-info.txt dynamic-section.txt linked-libraries.txt
          pushd dist/package
          sha256sum redhat > "../redhat-v${SOURCE_VERSION}-$TARGET-static-openssl.sha256"
          popd
          pushd dist
          sha256sum "redhat-v${SOURCE_VERSION}-$TARGET-static-openssl.tar.gz" \
            >> "redhat-v${SOURCE_VERSION}-$TARGET-static-openssl.sha256"
          popd
          "dist/package/redhat" --version
          echo "SOURCE_VERSION=$SOURCE_VERSION" >> "$GITHUB_ENV"

      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: redhat-v${{ env.SOURCE_VERSION }}-linux-x64-static-openssl
          path: |
            dist/redhat-v${{ env.SOURCE_VERSION }}-x86_64-unknown-linux-gnu-static-openssl.tar.gz
            dist/redhat-v${{ env.SOURCE_VERSION }}-x86_64-unknown-linux-gnu-static-openssl.sha256
          if-no-files-found: error
          retention-days: 30
