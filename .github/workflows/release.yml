name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build static Linux x86_64 release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          default: true

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Run tests
        run: cargo test --release --target x86_64-unknown-linux-musl --features openssl --verbose
      - name: Build release
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --features openssl
      - name: Verify static binary
        run: |
          file target/x86_64-unknown-linux-musl/release/redhat
          if readelf -d target/x86_64-unknown-linux-musl/release/redhat | grep -q NEEDED; then
            echo "redhat must not depend on dynamic libraries"
            exit 1
          fi
          target/x86_64-unknown-linux-musl/release/redhat --version

      - name: Run UPX
        continue-on-error: true
        uses: crazy-max/ghaction-upx@v1
        with:
          version: v4.0.2
          files: target/x86_64-unknown-linux-musl/release/redhat
          args: -q --best --lzma
      - uses: actions/upload-artifact@v4
        with:
          name: redhat-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/redhat
      - name: Zip Release
        uses: TheDoctor0/zip-release@0.6.1
        with:
          type: zip
          filename: redhat-linux-x86_64.zip
          directory: target/x86_64-unknown-linux-musl/release/
          path: redhat
      - name: Publish
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/x86_64-unknown-linux-musl/release/redhat-linux-x86_64.zip
          generate_release_notes: true
          draft: true
  docker:
    name: Publish to Docker Hub
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ github.repository_owner }}/redhat:latest, ${{ github.repository_owner }}/redhat:${{ github.ref_name }}
  publish-crate:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish
