name: Release

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build release for x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          default: true

      - name: Install OpenSSL
        run: sudo apt-get install pkg-config libssl-dev
      - name: Install target
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Run tests
        run: cargo test --release --target x86_64-unknown-linux-gnu --verbose
      - name: Build release
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Run UPX
        continue-on-error: true
        uses: crazy-max/ghaction-upx@v1
        with:
          version: v4.0.2
          files: target/x86_64-unknown-linux-gnu/release/redhat
          args: -q --best --lzma
      - uses: actions/upload-artifact@v4
        with:
          name: redhat-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/redhat
      - name: Zip Release
        uses: TheDoctor0/zip-release@0.6.1
        with:
          type: zip
          filename: redhat-x86_64-unknown-linux-gnu.zip
          directory: target/x86_64-unknown-linux-gnu/release/
          path: redhat
      - name: Publish
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/x86_64-unknown-linux-gnu/release/redhat-x86_64-unknown-linux-gnu.zip
          generate_release_notes: true
          draft: true
  docker:
    name: Publish to Docker Hub
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          push: true
          platforms: linux/amd64
          tags: ${{ github.repository_owner }}/redhat:latest, ${{ github.repository_owner }}/redhat:${{ github.ref_name }}
  publish-crate:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish
